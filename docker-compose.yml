# Environnement de DÉVELOPPEMENT uniquement (serveur Vite = sources exposées).
# Ne jamais exposer cette stack sur Internet : la production utilise prod.dockerfile.
services:
  back:
    image: python:3
    working_dir: /app
    command: bash -c "pip3 install -r requirements.txt && python3 app.py"
    volumes:
      - ./back:/app
    # [D6] Les secrets sont lus dans un fichier .env non versionné (voir .env.example)
    env_file:
      - .env
    environment:
      APP_ORIGIN_HOST: http://localhost:9000
      CORS_ORIGINS: http://localhost:9000
      FLASK_DEBUG: "1"

  front:
    image: node:22
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host"
    volumes:
      - ./front:/app

  apache:
    image: httpd:latest
    ports:
      - 127.0.0.1:9000:80
    volumes:
      - ./apache/apache-dev.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - back
      - front
